# =========================================================
# 前提インストール（コメント指南）
# =========================================================
# macOS:
#   brew install tmux git fish
#   ※ pbcopy / pbpaste は標準搭載
#
# Ubuntu:
#   sudo apt update
#   sudo apt install -y tmux git xclip
#
# TPM インストール（初回のみ）:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   tmux 起動後 prefix + I でプラグイン導入
# =========================================================


# =========================================================
# Shell 設定
# =========================================================
# fish が存在する場合のみ tmux のデフォルトシェルに設定
if-shell 'command -v fish >/dev/null 2>&1' 'set -g default-shell /opt/homebrew/bin/fish'
if-shell 'command -v fish >/dev/null 2>&1' 'set -g default-command /opt/homebrew/bin/fish'


# =========================================================
# Clipboard 設定
# =========================================================
# macOS: pbcopy
# Linux: xclip
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  "set-option -g @copy_cmd 'pbcopy'" \
  "set-option -g @copy_cmd 'xclip -selection clipboard'"


# =========================================================
# Terminal / Color
# =========================================================
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:Tc'


# =========================================================
# Status Bar
# =========================================================
set-option -g status-left-length 90
set-option -g status-right-length 90

set-option -g status-left '#H:[#P]'
set-option -g status-right '#(wifi) #(battery --tmux) [%Y-%m-%d(%a) %H:%M]'

set-option -g status-justify centre
set-option -g status-interval 1

set-option -g status-bg "colour238"
set-option -g status-fg "colour255"


# =========================================================
# Pane 操作（vim 風）
# =========================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind | split-window -h
bind - split-window -v

set-option -g base-index 1


# =========================================================
# Mouse / Copy-mode
# =========================================================
set-option -g mouse on
setw -g mode-keys vi

# スクロールアップで copy-mode
bind-key -n WheelUpPane \
  if-shell -F -t = "#{mouse_any_flag}" \
    "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' \
      'send-keys -M' \
      'select-pane -t=; copy-mode -e; send-keys -M'"

# 最下端までスクロールで copy-mode 抜け
bind-key -n WheelDownPane select-pane -t= \; send-keys -M


# ---------------------------------------------------------
# マウスドラッグコピー時に最下端へ飛ばない対策
# ---------------------------------------------------------
# copy-mode を終了せず、clipboard にもコピーする
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe "#{@copy_cmd}"


# =========================================================
# copy-mode key bindings（vi）
# =========================================================
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# スクロール維持（tmux buffer）
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Y send -X copy-line

# 明示的に copy-mode を抜けたい場合
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "#{@copy_cmd}"


# =========================================================
# Paste
# =========================================================
bind-key C-p paste-buffer


# =========================================================
# その他
# =========================================================
bind S set-window-option synchronize-panes
set-option -sg escape-time 10

# ホイール 1 行スクロール
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down


# =========================================================
# TPM / セッション保存・復元
# =========================================================
# Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# 手動保存・復元
# prefix + Ctrl-s : 保存
# prefix + Ctrl-r : 復元
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 自動保存・自動復元（推奨）
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# =========================================================
# TPM 初期化（必ず最下行）
# =========================================================
# tmux 起動後、prefix + Iを実行すること
run '~/.tmux/plugins/tpm/tpm'

